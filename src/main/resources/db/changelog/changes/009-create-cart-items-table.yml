databaseChangeLog:
  - changeSet:
      id: 009-create-cart-items-table
      author: kmularski
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_id
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: shopping_cart_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sc_id
                    referencedTableName: shopping_carts
                    referencedColumnNames: user_id
              - column:
                  name: quantity
                  type: bigint
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
