databaseChangeLog:
  - changeSet:
      id: 010-create-orders-table
      author: kmularski
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_user_id
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: status
                  type: varchar(25)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: order_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address
                  type: varchar(255)
                  constraints:
                    nullable: false
